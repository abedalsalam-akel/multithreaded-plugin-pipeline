name: C pipeline build and tests

on:
  push:
  pull_request:

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build C executable and shared libraries
        run: bash build.sh
      - name: Run integration tests
        run: bash test.sh
